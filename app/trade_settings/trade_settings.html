<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
  data-sidebar-position="fixed" data-header-position="fixed">
  <div id="sidebar"></div>
  <!--  Main wrapper -->
  <div class="body-wrapper">
    <div id="main-header"></div>

    <div class="main container p-3">
      <section class="mt-2 mb-4">
        <div class="d-flex align-items-center">
          <h2 class="my-3">Buy Processes</h2>
          <button id="buy-start" class="btn btn-success h-50 ml-2" onclick="runTrader(this, 'buy')">Run</button>
          <button id="buy-stop" class="btn btn-danger h-50 ml-2" style="display: none;" onclick="stopTrader(this, 'buy')">Stop</button>
        </div>
        <form class="py-2 px-4" id="buy_settings" endpoint="params/SetBuyParams" type="POST">
          <ul id="buy-runs">
            
          </ul>
          <button type="button" add-run="buy" class="btn btn-success my-3">Add Run</button>

          <button type="button" submit="buy_settings" class="btn btn-primary my-3">Submit</button>
        </form>
      </section>

      <section class="mt-2 mb-4">
        <div class="d-flex align-items-center">
          <h2 class="my-3">Short Processes</h2>
          <button id="short-start" class="btn btn-success h-50 ml-2" onclick="runTrader(this, 'short')">Run</button>
          <button id="short-stop" class="btn btn-danger h-50 ml-2" style="display: none;" onclick="stopTrader(this, 'short')">Stop</button>
        </div>
        <form class="py-2 px-4" id="short_settings" endpoint="params/SetShortParams" type="POST">
          <ul id="short-runs">
            
          </ul>
          <button type="button" add-run="short" class="btn btn-success my-3">Add Run</button>

          <button type="button" submit="short_settings" class="btn btn-primary my-3">Submit</button>
        </form>
      </section>
    </div>
  </div>
</div>
