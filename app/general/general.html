<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
  data-sidebar-position="fixed" data-header-position="fixed">
  <div id="sidebar"></div>
  <!--  Main wrapper -->
  <div class="body-wrapper">
    <div id="main-header"></div>

    <div class="main container p-3">
      <section class="mt-2 mb-4">
        <h2 class="my-3">General Settings</h2>
        <form class="py-2 px-4" id="general_settings" endpoint="params/SetGlobalParams" type="POST">
          <div class="form-group">
            <h6>Tradestation API</h6>
            <div class="form-check">
              <input name="is_live" value="1" class="form-check-input" type="radio" value="" id="live">
              <label class="form-check-label" for="live">
                Live API
              </label>
            </div>
            <div class="form-check">
              <input name="is_live" value="0" class="form-check-input" type="radio" value="" id="sim">
              <label class="form-check-label" for="sim">
                Simulation API
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="account_id">Account ID</label>
            <input class="form-control" id="account_id" name="account_id" placeholder="Account ID">
          </div>

          <div class="form-group">
            <label for="exampleInputEmail1">Trade with ?</label>

            <div class="form-row" id="money-row">
              <div class="col">
                <div class="form-check form-row d-flex align-items-center">
                  <input name="money_format" class="form-check-input" type="radio" value="1" id="full-power">
                  <label class="form-check-label" for="full-power">
                    Full Power
                  </label>
                  <input type="number" class="form-control w-50 ml-2" id="balance" placeholder="Total Balance" readonly>
                </div>
              </div>
              <div class="col">
                <div class="form-check form-row d-flex align-items-center">
                  <input name="money_format" class="form-check-input" type="radio" value="2" id="portion">
                  <label class="form-check-label" for="portion">
                    Portion
                  </label>
                  <input type="number" readonly class="form-control w-50 ml-2" id="money" placeholder="quantity">
                </div>
              </div>

              <div class="col">
                <div class="form-check form-row d-flex align-items-center">
                  <input name="money_format" class="form-check-input" type="radio" value="3" id="percent">
                  <label class="form-check-label" for="percent">
                    Percent
                  </label>

                  <input type="number" readonly class="form-control w-50 ml-2" id="money-percent" placeholder="Percent">
                </div>
              </div>

              <input hidden name="money" id="money">
            </div>
          </div>

          <div class="form-group">
            <label for="comp_operations">Compensatory Operaions ?</label>
            <div class="form-row">
              <div class="col">
                <div class="form-check form-row d-flex align-items-center">
                  <input name="no-revert" class="form-check-input" type="radio" value="1" id="comp-enabled">
                  <label class="form-check-label" for="comp-enabled">
                    Enabled
                  </label>
                </div>
                <div class="form-check form-row d-flex align-items-center">
                  <input name="no-revert" class="form-check-input" type="radio" value="0" id="comp-disabled">
                  <label class="form-check-label" for="comp-disabled">
                    Disabled
                  </label>
                </div>
              </div>
            </div>
          </div>

          <button type="button" submit="general_settings" class="btn btn-primary my-3">Submit</button>
        </form>
      </section>
    </div>
  </div>
</div>
